services:
  db:
    image: postgres:16-alpine
    container_name: secureshare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureshare
      POSTGRES_USER: secureshare
      POSTGRES_PASSWORD: secureshare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshare -d secureshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: secureshare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build: ./backend
    container_name: secureshare-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/secureshare.db
      STORAGE_PATH: /app/storage
      RUN_MIGRATIONS_ON_START: "true"
      DEMO_LOGIN_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - secure-files:/app/storage
      - secure-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: secureshare-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  secure-data:
  secure-files:
