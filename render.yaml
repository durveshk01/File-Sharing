services:
  - type: web
    name: secureshare-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_SECRET
        generateValue: true
      - key: KEK_BASE64
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secureshare-db
          property: connectionString
      # Storage configuration: 'local' for self-hosted fallback or 's3' for direct device-to-storage presigned transfers (AWS S3 / Cloudflare R2)
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: ./storage
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: FRONTEND_ORIGIN
        value: https://frontend-five-fawn-27.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: DEMO_LOGIN_ENABLED
        value: "true"

databases:
  - name: secureshare-db
    plan: free
    region: oregon
    databaseName: secureshare
    user: secureshare_user
